<style>
/* Layout: one phone-width column of soft cards, fixed tab bar with a raised plus button. */
:root {
  --bg: #FBF0F3;
  --card: #FFFFFF;
  --ink: #1E1C33;
  --muted: #8C8799;
  --line: #F1E5EA;
  --track: #F3EAEE;
  --accent: #4C6CE6;
  --accent-2: #7290F6;
  --accent-soft: #E9EEFD;
  --on-accent: #FFFFFF;
  --good: #23A862;
  --warn: #E39A2D;
  --bad: #E0506A;
  --bad-soft: #FDE8EC;
  --pig: #F6A3B7;
  --pig-dark: #DD7894;
  --pig-snout: #FBC6D3;
  --pig-ink: #3A2233;
  --shadow: 0 10px 30px -18px rgba(60, 40, 90, .35);
  --f-display: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-card: 24px;
}
@media (prefers-color-scheme: dark) {

    --good: #46CA86; --warn: #F0B04C; --bad: #FF7088; --bad-soft: #3A1E27;
    --pig: #F09AB0; --pig-dark: #C9688A; --pig-snout: #F7BCCB; --pig-ink: #2B1726;
    --shadow: 0 10px 30px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14131C; --card: #1F1E2B; --ink: #F4F2F9; --muted: #9B98AC; --line: #2C2A3A; --track: #2A2938;
  --accent: #7C94FF; --accent-2: #5671EC; --accent-soft: #252B4A; --on-accent: #FFFFFF;
  --good: #46CA86; --warn: #F0B04C; --bad: #FF7088; --bad-soft: #3A1E27;
  --pig: #F09AB0; --pig-dark: #C9688A; --pig-snout: #F7BCCB; --pig-ink: #2B1726;
  --shadow: 0 10px 30px -18px rgba(0, 0, 0, .8);

}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {

  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
button svg, .tile-title svg, .pill svg { width: 20px; height: 20px; flex: none; }

#app {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(120px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
h1 { font-family: var(--f-display); font-weight: 900; font-size: 2.3rem; line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 900; font-size: 1.45rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-weight: 500; }
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.card { background: var(--card); border-radius: var(--r-card); padding: 18px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 700; font-size: .98rem; }
.label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

/* header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 9px 15px; font-weight: 800; box-shadow: var(--shadow); border: 0; font-family: var(--f-display); font-size: 1.1rem; }
.pill.flame { color: var(--warn); }
.demo-banner { display: flex; align-items: center; gap: 12px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 18px; padding: 12px 14px; text-align: left; font-weight: 600; width: 100%; }
.demo-banner b { color: var(--ink); }

/* mascot card */
.buddy { display: flex; gap: 14px; align-items: center; }
.buddy .pig { width: 104px; flex: none; }
.bubble { background: var(--accent-soft); border-radius: 18px 18px 18px 6px; padding: 12px 14px; font-size: .98rem; }
.btn-outline { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: var(--accent); border: 2px solid var(--accent); border-radius: 999px; padding: 8px 16px; font-weight: 700; }
.buddy-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* hero */
.hero { background: linear-gradient(150deg, var(--accent-2), var(--accent)); color: var(--on-accent); border-radius: var(--r-card); padding: 20px; box-shadow: 0 18px 34px -20px var(--accent); }
.hero .big { font-family: var(--f-display); font-weight: 900; font-size: 3.3rem; line-height: 1; margin: 6px 0 10px; letter-spacing: -.02em; }
.hero.over { background: linear-gradient(150deg, #F07A8E, #D9475F); box-shadow: 0 18px 34px -20px #D9475F; }
.hero-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.hero-split div { background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px; }
.hero-split small { display: block; opacity: .85; font-size: .8rem; }
.hero-split b { font-family: var(--f-display); font-size: 1.25rem; }

/* tiles */
.tiles { display: grid; grid-template-columns: 1.55fr 1fr; gap: 12px; }
.tile-title { display: flex; align-items: center; gap: 6px; }
.tile-big { font-family: var(--f-display); font-weight: 900; font-size: 2rem; margin: 6px 0 10px; line-height: 1; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.week i { display: block; width: 100%; max-width: 30px; aspect-ratio: 1; margin: 0 auto 4px; border-radius: 10px; border: 2px solid var(--line); }
.week i.on { background: var(--warn); border-color: var(--warn); }
.week i.today { border-color: var(--warn); }
.week small { font-size: .72rem; color: var(--muted); font-weight: 600; }
.lvl-name { font-family: var(--f-display); font-weight: 900; font-size: 1.15rem; margin: 6px 0 10px; line-height: 1.15; }
.bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.thin { height: 8px; }

/* goal */
.goal { display: flex; gap: 14px; align-items: center; }
.goal .pig { width: 74px; flex: none; }

/* category rows */
.cat { display: flex; align-items: center; gap: 14px; padding: 15px 18px; border: 0; background: none; width: 100%; text-align: left; }
.cat + .cat { border-top: 1px solid var(--line); }
.ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.ico svg { width: 24px; height: 24px; }
.cat .meta { font-size: .88rem; color: var(--muted); margin-top: 5px; }
.cat .left { font-weight: 800; font-family: var(--f-display); font-size: 1.02rem; white-space: nowrap; }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; color: var(--muted); background: var(--track); border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }
.chev { color: var(--muted); width: 18px; flex: none; }
.add-dashed { width: 100%; border: 2px dashed color-mix(in srgb, var(--accent) 40%, transparent); background: transparent; color: var(--accent); border-radius: var(--r-card); padding: 18px; font-weight: 700; font-size: 1.02rem; }

/* entries */
.entry { display: flex; align-items: center; gap: 12px; padding: 13px 18px; background: none; border: 0; width: 100%; text-align: left; }
.entry + .entry { border-top: 1px solid var(--line); }
.entry .ico { width: 38px; height: 38px; border-radius: 12px; }
.entry .ico svg { width: 20px; height: 20px; }
.entry small { color: var(--muted); }
.amt { font-family: var(--f-display); font-weight: 800; white-space: nowrap; }
.empty { padding: 20px 18px; color: var(--muted); text-align: center; }

/* budget head */
.month-switch { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.month-switch button { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.month-switch b { font-family: var(--f-display); min-width: 92px; text-align: center; }
.income { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 16px; padding: 12px 14px; border: 0; width: 100%; font-weight: 700; }
.income > span { white-space: nowrap; }
.income b { font-family: var(--f-display); font-size: 1.2rem; }
.stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--track); gap: 2px; }
.stack span { display: block; height: 100%; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 small { color: var(--muted); display: block; font-size: .85rem; }
.stats3 b { font-family: var(--f-display); font-size: 1.25rem; }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border-radius: 18px; padding: 5px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 10px 4px; border-radius: 14px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }

/* charts */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--f-body); }
.legend { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px 12px; align-items: center; margin-top: 14px; }
.legend .dot { width: 12px; height: 12px; border-radius: 50%; }
.legend .pct { color: var(--muted); text-align: right; }
.legend .val { font-family: var(--f-display); font-weight: 800; text-align: right; }

/* profile */
.avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; overflow: hidden; }
.avatar .pig { width: 62px; margin-top: 8px; }
.stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-tiles .card { padding: 14px; }
.stat-tiles svg { width: 26px; height: 26px; }
.stat-tiles b { display: block; font-family: var(--f-display); font-size: 1.6rem; font-weight: 900; margin-top: 6px; }
.stat-tiles small { color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; margin-top: 14px; }
.badge { text-align: center; font-size: .72rem; font-weight: 600; color: var(--muted); border: 0; background: none; padding: 0; }
.badge .medal { width: 58px; height: 58px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; background: var(--track); color: var(--muted); }
.badge .medal svg { width: 28px; height: 28px; }
.badge.got { color: var(--ink); }
.badge.got .medal { background: linear-gradient(150deg, #FFD983, #F2A93B); color: #6B3F05; box-shadow: 0 0 0 3px var(--card), 0 0 0 5px #F2C25B; }
.section-label { color: var(--muted); font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin: 8px 4px -4px; }
.setting { display: flex; align-items: center; gap: 14px; padding: 15px 18px; border: 0; background: none; width: 100%; text-align: left; font-weight: 600; }
.setting + .setting { border-top: 1px solid var(--line); }
.setting svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.setting .val { margin-left: auto; color: var(--muted); font-weight: 600; }
.setting.danger, .setting.danger svg { color: var(--bad); }
.foot { text-align: center; color: var(--muted); font-size: .85rem; padding: 6px 20px; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);

.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }

.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--accent); }
.fab-wrap { display: grid; place-items: center; }
.fab { width: 66px; height: 66px; border-radius: 50%; border: 0; margin-top: -30px; margin-bottom: 8px; background: linear-gradient(150deg, var(--accent-2), var(--accent)); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 14%, transparent), 0 12px 24px -10px var(--accent); }
.fab svg { width: 32px; height: 32px; }

.sheet {
  background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 28px 28px 0 0;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .24s cubic-bezier(.2, .8, .2, 1); overflow-x: hidden;
}
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 2px; }
.sheet > * { flex-shrink: 0; } /* long sheets scroll instead of squashing cards */
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .85rem; font-weight: 700; color: var(--muted); }
.input { width: 100%; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 13px 14px; font-size: 1.05rem; outline: none; }
.input:focus { border-color: var(--accent); }
.amount-input { font-family: var(--f-display); font-weight: 900; font-size: 2.8rem; text-align: center; padding: 14px; letter-spacing: -.01em; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 16px; border: 2px solid transparent; background: var(--card); font-size: .82rem; font-weight: 700; text-align: center; line-height: 1.15; }
.chip .ico { width: 38px; height: 38px; border-radius: 12px; }
.chip .ico svg { width: 20px; height: 20px; }
.chip.on { border-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 2px transparent; }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.icon-grid button { aspect-ratio: 1; border-radius: 14px; border: 2px solid transparent; background: var(--card); display: grid; place-items: center; }
.icon-grid button.on { border-color: var(--accent); color: var(--accent); }
.icon-grid svg { width: 22px; height: 22px; }
.btn { border: 0; border-radius: 18px; padding: 16px; font-weight: 800; font-size: 1.05rem; background: var(--accent); color: var(--on-accent); width: 100%; font-family: var(--f-display); }
.btn.ghost { background: var(--card); color: var(--ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; }
.hint { color: var(--muted); font-size: .88rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(108px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow); animation: up .2s ease; white-space: nowrap; }
textarea.input { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.wish-done { background: linear-gradient(135deg, color-mix(in srgb, #F5C84B 24%, var(--card)), var(--card) 70%); box-shadow: 0 0 0 2px #E8B53A, 0 0 22px color-mix(in srgb, #F5C84B 50%, transparent); animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 2px #F5C84B, 0 0 36px color-mix(in srgb, #F5C84B 80%, transparent); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.pig { width: 96px; height: auto; flex: none; }
.pig.bob { animation: bob 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@media (max-width: 370px) { .tiles { grid-template-columns: 1fr; } .hero .big { font-size: 2.8rem; } }
</style>

/* ---------- budget engine ---------- */
function budgetMonth(off = 0, ref = today()) {
  const sd = Math.min(S.startDay || 1, 28);
  let y = ref.getFullYear(), m = ref.getMonth();
  if (ref.getDate() < sd) m -= 1;
  m += off;
  const start = new Date(y, m, sd);
  const end = addDays(new Date(y, m + 1, sd), -1);
  return { start, end, days: diffDays(start, end) + 1, label: MON[(sd === 1 ? start : addDays(start, 14)).getMonth()], year: start.getFullYear() };
}
const cat = id => S.cats.find(c => c.id === id);
const inRange = (e, a, b) => e.date >= ymd(a) && e.date <= ymd(b);
const spentBetween = (a, b, pred = () => true) => S.entries.reduce((s, e) => inRange(e, a, b) && pred(e) ? s + e.amount : s, 0);
const isExpense = e => { const c = cat(e.cat); return !c || c.kind !== 'spar'; };
const monthEquiv = (c, days) => c.period === 'day' ? c.limit * days : c.period === 'week' ? c.limit * days / 7 : c.limit;

function compute() {
  const t = today();
  const M = budgetMonth(0);
  const tracked = parse(S.created) > M.start ? parse(S.created) : M.start;
  const daysLeftMonth = diffDays(t, M.end) + 1;
  const ws = weekStart(t), we = addDays(ws, 6);
  const daysLeftWeek = Math.min(diffDays(t, we), diffDays(t, M.end)) + 1;
  const rows = S.cats.map(c => {
    let spent, limit, left, periodLabel, todayLeft = 0, weekLeft = 0;
    if (c.kind === 'var' && c.period === 'day') {
      const days = diffDays(tracked, t) + 1;
      spent = spentBetween(t, t, e => e.cat === c.id);
      const spentSince = spentBetween(tracked, t, e => e.cat === c.id);
      left = c.limit * days - spentSince;           // rolls over within the budget month
      limit = c.limit; periodLabel = 'hüt';
      todayLeft = left;
      weekLeft = left + c.limit * (daysLeftWeek - 1);
    } else if (c.kind === 'var' && c.period === 'week') {
      spent = spentBetween(ws, we, e => e.cat === c.id);
      limit = c.limit; left = limit - spent; periodLabel = 'die Wuche';
      const dlw = diffDays(t, we) + 1;
      todayLeft = left / dlw; weekLeft = left;
    } else {
      spent = spentBetween(M.start, M.end, e => e.cat === c.id);
      limit = c.limit; left = limit - spent; periodLabel = 'de Monet';
      if (c.kind === 'var') { todayLeft = left / daysLeftMonth; weekLeft = left * daysLeftWeek / daysLeftMonth; }
    }
    const used = limit > 0 ? (limit - left) / limit : 0;
    return { c, spent, limit, left, used, periodLabel, todayLeft, weekLeft };
  });
  const varRows = rows.filter(r => r.c.kind === 'var');
  const todayLeft = varRows.reduce((s, r) => s + r.todayLeft, 0);
  const weekLeft = varRows.reduce((s, r) => s + r.weekLeft, 0);
  const monthSpent = spentBetween(M.start, M.end, isExpense);
  const monthSaved = spentBetween(M.start, M.end, e => !isExpense(e));
  const budgetTotal = S.cats.reduce((s, c) => s + monthEquiv(c, M.days), 0);
  const monthOut = monthSpent + monthSaved;
  const leftInBudget = budgetTotal - monthOut;
  // pace forecast: fixed + savings as planned, variable at current daily pace
  const elapsed = Math.max(1, diffDays(tracked, t) + 1);
  const varSpent = spentBetween(tracked, t, e => cat(e.cat)?.kind === 'var');
  const varPace = varSpent / elapsed * (diffDays(tracked, M.end) + 1);
  const varSpentBeforeTracked = spentBetween(M.start, addDays(tracked, -1), e => cat(e.cat)?.kind === 'var');
  const plannedFixed = S.cats.filter(c => c.kind !== 'var').reduce((s, c) => s + Math.max(c.limit, spentBetween(M.start, M.end, e => e.cat === c.id)), 0);
  const forecast = S.income - plannedFixed - varPace - varSpentBeforeTracked;
  const saved = (S.goal?.base || 0) + pots().reduce((a, p) => a + (p.base || 0), 0) + S.entries.reduce((s, e) => !isExpense(e) ? s + e.amount : s, 0);
  const GT = goalTotals();
  return { t, M, rows, todayLeft, weekLeft, daysLeftMonth, daysLeftWeek, monthSpent, monthSaved, budgetTotal, leftInBudget, forecast, saved, ws, GT };
}

/* ---------- savings goals: main goal + special goals (pots) ---------- */
const pots = () => S.pots || (S.pots = []);

function splitFor(amount, to = 'auto') {
  if (to === 'main') return {};
  if (to !== 'auto') return pots().some(p => p.id === to) ? { [to]: amount } : {};
  const out = {};
  pots().forEach(p => { if (p.pct > 0 && !p.done) out[p.id] = Math.round(amount * p.pct) / 100; });
  return out;
}
function goalTotals() {
  const ids = new Set(pots().map(p => p.id));
  const potSaved = Object.fromEntries(pots().map(p => [p.id, p.base || 0]));
  let main = S.goal?.base || 0;
  S.entries.forEach(e => {
    if (isExpense(e)) return;
    let rest = e.amount;
    Object.entries(e.split || {}).forEach(([id, v]) => { if (ids.has(id)) { potSaved[id] += v; rest -= v; } });

}

const CHAL = {

// status is derived from the entries every render, so edits and deletions stay consistent
function chalState(ch) {
  const t = today(), st = parse(ch.start), def = CHAL[ch.type];
  if (ch.type === 'save52') {
    const done = S.entries.filter(e => e.chal === ch.id).length, week = Math.floor(diffDays(st, t) / 7) + 1;
    return { status: done >= 52 ? 'won' : 'active', pct: done / 52 * 100, text: `${done} vo 52 Wuche · ${chf(done * (done + 1) / 2)} gspart`, next: done < 52 && done + 1 <= week ? done + 1 : 0 };
  }
  if (ch.type === 'extra10') {
    const M = budgetMonth(0, st), goal = Math.round(plannedMonthly() * 1.1);
    const saved = spentBetween(M.start, M.end, e => cat(e.cat)?.kind === 'spar');
    const status = saved >= goal ? 'won' : t > M.end ? 'failed' : 'active';
    return { status, pct: goal ? saved / goal * 100 : 0, text: `${chf(saved)} vo ${chf(goal)} bis ${shortDate(ymd(M.end))}` };
  }
  const end = addDays(st, def.days - 1), last = t > end ? end : t, n = diffDays(st, last) + 1;
  if (ch.type === 'nospend') {
    let cnt = 0;
    for (let d = st; d <= last; d = addDays(d, 1)) if (varSpentOn(d) === 0 && (ymd(d) < ymd(t) || S.checkins.includes(ymd(d)))) cnt++;
    return { status: cnt >= 3 ? 'won' : t > end ? 'failed' : 'active', pct: cnt / 3 * 100, text: `${cnt} vo 3 Täg · no ${Math.max(0, diffDays(t, end) + 1)} Täg Zyt` };
  }
  if (ch.type === 'nocat') {

    return { status: hit ? 'failed' : t > end ? 'won' : 'active', pct: n / def.days * 100, text: `${esc(cat(ch.cat)?.name || '?')} · Tag ${Math.min(n, def.days)} vo ${def.days}` };
  }
  // budget7: a finished day over the daily limit fails it

}

// on Sunday the current week is reviewed, otherwise the last finished week
const reviewWeek = () => { const t = today(); return t.getDay() === 0 ? weekStart(t) : addDays(weekStart(t), -7); };
const weekLimit = c => c.period === 'day' ? c.limit * 7 : c.period === 'week' ? c.limit : c.limit * 7 / 30.4;
function weekStats(ws) {
  const we = addDays(ws, 6), act = activeDays();
  const isVar = e => cat(e.cat)?.kind === 'var';
  const varSpent = spentBetween(ws, we, isVar), fixSpent = spentBetween(ws, we, e => cat(e.cat)?.kind === 'fix');
  const saved = spentBetween(ws, we, e => cat(e.cat)?.kind === 'spar');
  const cats = S.cats.filter(c => c.kind === 'var').map(c => ({ c, spent: spentBetween(ws, we, e => e.cat === c.id), lim: weekLimit(c) })).filter(r => r.spent > 0).sort((a, b) => b.spent - a.spent);
  const dl = dayLimitSum(), dayCat = e => { const c = cat(e.cat); return c && c.kind === 'var' && c.period === 'day'; };
  let goodDays = 0, days = 0;
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d > today()) break; days++; if (!dl || spentBetween(d, d, dayCat) <= dl) goodDays++; }
  let active = 0; for (let i = 0; i < 7; i++) if (act.has(ymd(addDays(ws, i)))) active++;
  const top = S.entries.filter(e => inRange(e, ws, we) && isVar(e)).sort((a, b) => b.amount - a.amount)[0];
  return { ws, we, varSpent, fixSpent, saved, cats, goodDays, days, active, top, varLimit: S.cats.filter(c => c.kind === 'var').reduce((t, c) => t + weekLimit(c), 0) };
}

/* ---------- streak, xp, badges ---------- */
function activeDays() {
  const set = new Set(S.checkins);
  S.entries.forEach(e => set.add(e.date));
  return set;
}
function streakInfo() {
  const act = activeDays();
  const t = today();
  let d = act.has(ymd(t)) ? t : addDays(t, -1);
  let n = 0;
  while (act.has(ymd(d))) { n++; d = addDays(d, -1); }
  let best = 0, run = 0;
  [...act].sort().forEach((s, i, arr) => { run = i && diffDays(parse(arr[i - 1]), parse(s)) === 1 ? run + 1 : 1; best = Math.max(best, run); });
  return { n, best, todayDone: act.has(ymd(t)), act };
}
const LEVELS = [
  [0, 'Rappe-Rookie'], [100, 'Münz-Sammler'], [250, 'Batze-Hüeter'], [450, 'Budget-Ninja'], [700, 'Spar-Füchsli'],
  [1000, 'Tresor-Wächter'], [1400, 'Zins-Zauberer'], [1900, 'Franke-Profi'], [2500, 'Spar-Held'], [3200, 'Batzli-Legände'],
];
function xpInfo() {
  const act = activeDays();
  const t = today();
  const dayLimit = S.cats.filter(c => c.kind === 'var' && c.period === 'day').reduce((s, c) => s + c.limit, 0);
  let xp = act.size * 10;
  const perDay = {};
  S.entries.forEach(e => { perDay[e.date] = (perDay[e.date] || 0) + 1; });
  Object.values(perDay).forEach(n => { xp += Math.min(n, 5) * 2; });
  let goodDays = 0;
  if (dayLimit > 0) act.forEach(s => {
    if (s >= ymd(t)) return;
    const d = parse(s);
    const spent = spentBetween(d, d, e => { const c = cat(e.cat); return c && c.kind === 'var' && c.period === 'day'; });
    if (spent <= dayLimit) { xp += 15; goodDays++; }
  });
  xp += Math.floor(S.entries.reduce((s, e) => !isExpense(e) ? s + e.amount : s, 0) / 10);
  xp += S.entries.filter(e => e.bonus).length * 50;
  xp += (S.wishes || []).filter(w => w.status === 'skipped').length * 20;
  xp += (S.wishes || []).filter(w => w.status === 'bought' && w.adds?.length).length * 30;
  xp += (S.challenges || []).filter(c => c.won).length * 100;
  xp += (S.reviews || []).length * 20;
  let li = 0;
  LEVELS.forEach(([min], i) => { if (xp >= min) li = i; });
  const cur = LEVELS[li][0], next = LEVELS[li + 1]?.[0] ?? cur + 1000;
  return { xp, level: li + 1, name: LEVELS[li][1], cur, next, goodDays };
}

function catRow(r, opts = {}) {
  const c = r.c;
  const pct = r.limit > 0 ? Math.min(100, Math.max(0, r.used * 100)) : 0;
  const color = r.left < 0 ? 'var(--bad)' : c.color;
  const leftTxt = c.kind === 'fix' && r.left <= 0.5 && r.left >= -0.5 ? '<span style="color:var(--muted)">Zahlt</span>'
    : c.kind === 'spar' ? `<span style="color:var(--good)">${fmt0(r.spent)} gspart</span>`
    : r.left < 0 ? `<span style="color:var(--bad)">${fmt0(-r.left)} drüber</span>`
    : `<span style="color:var(--good)">${fmt0(r.left)} übrig</span>`;
  const per = c.kind === 'var' ? { day: 'pro Tag', week: 'pro Wuche', month: 'pro Monet' }[c.period] : c.kind === 'fix' ? 'Fixkoste' : 'Spare';
  const meta = c.kind === 'var' && c.period === 'day'
    ? `Hüt ${fmt0(r.spent)} usgäh · ${fmt0(c.limit)} pro Tag`
    : `${fmt0(r.spent)} vo ${fmt0(r.limit)} CHF ${c.kind === 'var' ? (c.period === 'week' ? 'die Wuche' : 'de Monet') : ''}${c.kind === 'fix' && c.autoDay ? ` · automatisch am ${c.autoDay}.` : ''}`;
  const dayPct = c.kind === 'var' && c.period === 'day' ? Math.min(100, Math.max(0, (1 - r.left / Math.max(c.limit, 1)) * 100)) : pct;
  return `<button class="cat" data-act="${opts.act || 'catd'}" data-id="${c.id}">
    <span class="ico" style="background:color-mix(in srgb, ${c.color} 15%, transparent);color:${c.color}">${ic(c.icon)}</span>
    <span class="grow">
      <span class="between"><b>${esc(c.name)}${opts.tag ? `<span class="tag">${per}</span>` : ''}</b><span class="left num">${leftTxt}</span></span>
      <span class="bar thin" style="margin-top:8px;display:block"><span style="width:${c.kind === 'var' && c.period === 'day' ? dayPct : pct}%;background:${color}"></span></span>
      <span class="meta num" style="display:block">${meta}</span>
    </span>
    ${opts.chev ? ic('chevR', 'chev') : ''}
  </button>`;
}

function entryList(list, empty = 'No kei Iiträg. Drück uf s Plus unde.') {
  if (!list.length) return `<div class="empty">${empty}</div>`;
  return list.map(e => {

function recurRow(r) {

    <div><div class="sub">${left >= 0 ? 'No übrig im Budget' : 'Übers Budget'}</div><div class="num" style="font-family:var(--f-display);font-weight:900;font-size:2.6rem;line-height:1.1;color:${left < 0 ? 'var(--bad)' : 'inherit'}">${chf(Math.abs(left))}</div></div>

function barChart(bars, line, lineLabel) {
  const W = 340, H = 200, top = 26, bottom = 30, h = H - top - bottom;
  const max = Math.max(1, line || 0, ...bars.map(b => b.v)) * 1.08;
  const bw = W / bars.length;
  const y = v => top + h - (v / max) * h;
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Usgabe-Verlauf">`;
  out += `<line x1="0" x2="${W}" y1="${top + h}" y2="${top + h}" stroke="var(--line)" stroke-width="1.5"/>`;
  bars.forEach((b, i) => {
    const x = i * bw + bw * 0.18, w = bw * 0.64, yy = y(b.v);
    const fill = b.hl ? 'url(#gb)' : 'var(--accent-soft)';
    if (b.v > 0) out += `<rect x="${x}" y="${yy}" width="${w}" height="${top + h - yy}" rx="${Math.min(10, w / 3)}" fill="${fill}"/>`;
    out += `<text x="${x + w / 2}" y="${Math.min(yy, top + h) - 7}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">${fmt0(b.v)}</text>`;
    out += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="12" font-weight="${b.hl ? 800 : 600}" fill="${b.hl ? 'var(--ink)' : 'var(--muted)'}">${b.l}</text>`;
  });
  if (line) {
    const ly = y(line);
    out += `<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
    out += `<text x="${W}" y="${ly - 6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--bad)">${lineLabel} ${fmt0(line)}</text>`;
  }
  out += `<defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs></svg>`;
  return out;
}

function viewAnalyse() {
  const C = compute();
  const t = C.t, r = UI.range;
  const varMonth = S.cats.filter(c => c.kind === 'var').reduce((s, c) => s + monthEquiv(c, C.M.days), 0);
  const allMonth = S.cats.filter(c => c.kind !== 'spar').reduce((s, c) => s + monthEquiv(c, C.M.days), 0);
  let bars = [], line = 0, lineLabel = 'Budget', from, to, title;
  if (r === 'week') {
    from = C.ws; to = addDays(from, 6); title = 'Die Wuche';
    bars = WD2.map((l, i) => { const d = addDays(from, i); return { l, v: spentBetween(d, d, e => cat(e.cat)?.kind === 'var'), hl: ymd(d) === ymd(t) }; });
    line = varMonth / C.M.days; lineLabel = 'Tagesbudget';
  } else if (r === 'month') {
    from = C.M.start; to = C.M.end; title = C.M.label;
    for (let i = 0; i * 7 < C.M.days; i++) {
      const a = addDays(from, i * 7), b = addDays(from, Math.min(i * 7 + 6, C.M.days - 1));
      bars.push({ l: `W${i + 1}`, v: spentBetween(a, b, isExpense), hl: t >= a && t <= b });
    }
    line = allMonth * 7 / C.M.days; lineLabel = 'Budget pro Wuche';
  } else {
    const n = r === 'half' ? 6 : 12;
    from = budgetMonth(-(n - 1)).start; to = C.M.end; title = r === 'half' ? '6 Mönet' : '12 Mönet';
    for (let i = n - 1; i >= 0; i--) { const m = budgetMonth(-i); bars.push({ l: MON3[(S.startDay === 1 ? m.start : addDays(m.start, 14)).getMonth()], v: spentBetween(m.start, m.end, isExpense), hl: i === 0 }); }
    line = allMonth; lineLabel = 'Budget';
  }
  const list = S.entries.filter(e => inRange(e, from, to));
  const by = {};
  list.forEach(e => { by[e.cat] = (by[e.cat] || 0) + e.amount; });
  const sum = Object.values(by).reduce((a, b) => a + b, 0);
  const sorted = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const fc = C.forecast;
  const biggest = list.slice().sort((a, b) => b.amount - a.amount).slice(0, 5);
  return `
  <header class="top"><h1>Analyse</h1><button class="link" data-act="review">Wuche-Rückblick</button></header>
  <div class="seg" role="tablist">${[['week', 'Wuche'], ['month', 'Monet'], ['half', '6 Mönet'], ['year', 'Jahr']].map(([k, l]) => `<button role="tab" class="${r === k ? 'on' : ''}" data-act="range" data-r="${k}">${l}</button>`).join('')}</div>
  <section class="card buddy">
    ${pig(fc >= 0 ? 'happy' : 'worried')}
    <div class="grow">
      <div class="label" style="color:var(--accent)">Prognose · no ${C.daysLeftMonth} Täg</div>
      <div style="margin-top:6px">${fc >= 0 ? `Wänn's so wiitergaht, landisch Ende ${C.M.label} bi rund <b class="num">${chf(fc)} Plus</b>.` : `Wänn's so wiitergaht, fehled dir Ende ${C.M.label} rund <b class="num">${chf(-fc)}</b>. Bremse lohnt sich!`}</div>
    </div>
  </section>
  <section class="card chart">
    <div class="between" style="margin-bottom:6px"><h2 style="font-size:1.2rem">Verlauf</h2><span class="sub" style="font-size:.85rem">${r === 'week' ? 'Variabli Usgabe pro Tag' : r === 'month' ? 'Usgabe pro Wuche' : 'Usgabe pro Monet'}</span></div>
    ${barChart(bars, line, lineLabel)}
  </section>
  <section class="card">
    <div class="between"><h2 style="font-size:1.2rem">Wohii isch s Gäld?</h2><span class="sub num" style="font-size:.85rem">${title} · ${fmt0(sum)}</span></div>
    ${sum ? `<div class="stack" style="margin-top:14px">${sorted.map(([id, v]) => `<span style="width:${v / sum * 100}%;background:${cat(id)?.color || '#8A94A6'}"></span>`).join('')}</div>
    <div class="legend">${sorted.map(([id, v]) => `<span class="dot" style="background:${cat(id)?.color || '#8A94A6'}"></span><span>${esc(cat(id)?.name || 'Gelöscht')}</span><span class="pct num">${Math.round(v / sum * 100)} %</span><span class="val num">${fmt0(v)}</span>`).join('')}</div>`
    : '<div class="empty">I dem Ziitruum git\'s no kei Iiträg.</div>'}
  </section>
  <h2 style="margin-top:8px">Grössti Iiträg</h2>
  <section class="card flush">${entryList(biggest)}</section>`;
}

function sheetEntry(s) {

    <input id="f-amount" class="input amount-input num" inputmode="decimal" placeholder="0.00" value="${e ? e.amount : (s.amount || '')}" autocomplete="off" aria-label="Betrag in CHF">

      <div class="chips">${S.cats.map(c => `<button class="chip ${c.id === sel ? 'on' : ''}" data-act="pickcat" data-id="${c.id}"><span class="ico" style="background:color-mix(in srgb, ${c.color} 15%, transparent);color:${c.color}">${ic(c.icon)}</span>${esc(c.name)}</button>`).join('')}</div>

const app = document.getElementById('app'), nav = document.getElementById('nav'), layer = document.getElementById('layer');
// fixed costs with autoDay get booked once per calendar month on that day
function autoBook() {
  S.autoDone = S.autoDone || [];
  const t = today(), created = parse(S.created);
  let added = 0;
  S.cats.forEach(c => {
    if (c.kind !== 'fix' || !c.autoDay || !(c.limit > 0)) return;
    for (let d = new Date(created.getFullYear(), created.getMonth(), 1); d <= t; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      const due = new Date(d.getFullYear(), d.getMonth(), c.autoDay);
      const key = `${c.id}-${due.getFullYear()}-${pad(due.getMonth() + 1)}`;
      if (due > t || S.autoDone.includes(key)) continue;
      S.autoDone.push(key);
      const ym = key.slice(-7);
      if (S.entries.some(e => e.cat === c.id && e.date.slice(0, 7) === ym)) continue; // already entered by hand
      S.entries.push({ id: uid(), amount: c.limit, cat: c.id, note: c.name, date: ymd(due), ts: +due + 8 * 3600e3, auto: true });
      added++;
    }
  });
  recurs().forEach(r => {
    if (r.paused || !(r.amount > 0) || !cat(r.cat)) return;
    const isSpar = cat(r.cat).kind === 'spar';
    for (let i = 0; i < 3000; i++) {
      const due = occ(r, i);
      if (due > t) break;
      const key = `r-${r.id}-${ymd(due)}`;
      if (S.autoDone.includes(key)) continue;
      S.autoDone.push(key);
      S.entries.push({ id: uid(), amount: r.amount, cat: r.cat, note: r.name, date: ymd(due), ts: +due + 8 * 3600e3, auto: true, rec: r.id, ...(isSpar ? { to: 'auto', split: splitFor(r.amount) } : {}) });
      added++;
    }
  });
  if (added) save();
  return added;
}

}

    case 'pickto': keepEntryDraft(); UI.sheet.to = el.dataset.k; renderSheet(); break;
    case 'pots': UI.sheet = { type: 'simple', kind: 'pots' }; renderSheet(); break;
    case 'newpot': UI.sheet = { type: 'simple', kind: 'pot', draft: { name: '', target: '', base: '', due: '', pct: Math.min(20, 100 - potPctSum()), icon: ['plane', 'gift', 'car', 'home', 'heart', 'sun'][pots().length % 6], color: COLORS[(pots().length + 4) % COLORS.length] } }; renderSheet(); break;
    case 'editpot': { const p = pots().find(x => x.id === el.dataset.id); UI.sheet = { type: 'simple', kind: 'pot', id: p.id, draft: { ...p } }; renderSheet(); break; }
    case 'picon': keepPotDraft(); UI.sheet.draft.icon = el.dataset.n; renderSheet(); break;
    case 'pcolor': keepPotDraft(); UI.sheet.draft.color = el.dataset.c; renderSheet(); break;
    case 'savepot': {
      keepPotDraft(); const d = UI.sheet.draft, id = UI.sheet.id;
      if (!d.name) { toast('Bitte en Name iigä'); break; }
      if (!(d.target > 0)) { toast('Bitte es Ziel in CHF iigä'); break; }
      const free = 100 - potPctSum() + (id ? (pots().find(p => p.id === id)?.pct || 0) : 0);
      const rec = { name: d.name, target: d.target, base: d.base || 0, due: d.due || '', pct: Math.max(0, Math.min(free, Math.round(d.pct || 0))), icon: d.icon, color: d.color };
      if (id) Object.assign(pots().find(p => p.id === id), rec); else pots().push({ id: uid(), ...rec });
      save(); UI.sheet = { type: 'simple', kind: 'pots' }; render(); toast(rec.pct < (d.pct || 0) ? `Gspeicheret, uf ${rec.pct} % begrenzt` : 'Gspeicheret'); break;
    }
    case 'delpot':
      if (!UI.sheet.armed) { keepPotDraft(); UI.sheet.armed = true; renderSheet(); break; }
      S.pots = pots().filter(p => p.id !== UI.sheet.id); save(); UI.sheet = { type: 'simple', kind: 'pots' }; render(); toast('Sonderziel glöscht'); break;
    case 'pct': case 'pctset': {
      const p = pots().find(x => x.id === el.dataset.id); if (!p) break;
      const free = 100 - potPctSum() + (p.pct || 0);
      const nv = a === 'pct' ? (p.pct || 0) + Number(el.dataset.d) : Number(el.dataset.v);
      p.pct = Math.max(0, Math.min(free, nv)); save(); render(); break;
    }
    case 'showall': UI.showAll = true; render(); break;
    case 'range': UI.range = el.dataset.r; render(); break;
    case 'newcat': UI.sheet = { type: 'cat', draft: { name: '', icon: 'dots', color: COLORS[S.cats.length % COLORS.length], kind: 'var', period: 'month', limit: '' } }; renderSheet(); break;
    case 'editcat': { const c = cat(el.dataset.id); UI.sheet = { type: 'cat', id: c.id, draft: { ...c }, back: backable() }; renderSheet(); break; }
    case 'ckind': keepCatDraft(); UI.sheet.draft.kind = el.dataset.k; if (el.dataset.k !== 'var') UI.sheet.draft.period = 'month'; renderSheet(); break;
    case 'cperiod': keepCatDraft(); UI.sheet.draft.period = el.dataset.k; renderSheet(); break;
    case 'cicon': keepCatDraft(); UI.sheet.draft.icon = el.dataset.n; renderSheet(); break;
    case 'ccolor': keepCatDraft(); UI.sheet.draft.color = el.dataset.c; renderSheet(); break;
    case 'savecat': {
      keepCatDraft(); const d = UI.sheet.draft;
      if (!d.name) { toast('Bitte en Name iigä'); break; }
      if (!(d.limit >= 0) || d.limit === '') { toast('Bitte es Budget iigä'); break; }
      const rec = { name: d.name, icon: d.icon, color: d.color, kind: d.kind, period: d.kind === 'var' ? d.period : 'month', limit: d.limit, autoDay: d.kind === 'fix' ? (d.autoDay || 0) : 0 };
      if (UI.sheet.id) Object.assign(cat(UI.sheet.id), rec); else S.cats.push({ id: uid(), ...rec });
      commit('Gspeicheret'); break;
    }
    case 'delcat':
      if (!UI.sheet.armed) { keepCatDraft(); UI.sheet.armed = true; renderSheet(); break; }
      S.cats = S.cats.filter(c => c.id !== UI.sheet.id); UI.sheet.back = null; commit('Kategorie glöscht'); break;
    case 'income': case 'name': case 'startday': case 'goal': case 'export': case 'import': case 'wipe':
      UI.backToPots = a === 'goal' && UI.sheet?.kind === 'pots'; UI.sheet = { type: 'simple', kind: a }; renderSheet(); break;
    case 'badge': UI.sheet = { type: 'simple', kind: 'badge', i: Number(el.dataset.i) }; renderSheet(); break;
    case 'savesimple': {
      const k = UI.sheet.kind;
      if (k === 'income') { const v = num('s-val'); if (!(v >= 0)) { toast('Bitte e Zahl iigä'); break; } S.income = v; }
      if (k === 'name') S.name = val('s-val');
      if (k === 'startday') S.startDay = Number(val('s-val')) || 1;
      commit('Gspeicheret'); break;
    }
    case 'savegoal': S.goal = { name: val('g-name') || 'Sparziel', target: num('g-target') || 0, base: num('g-base') || 0 }; if (UI.backToPots) { UI.backToPots = false; save(); UI.sheet = { type: 'simple', kind: 'pots' }; render(); toast('Gspeicheret'); } else commit('Gspeicheret'); break;
    case 'copyexport': {
      const ta = document.getElementById('x-json');
      navigator.clipboard?.writeText(ta.value).then(() => toast('Kopiert'), () => { ta.focus(); ta.select(); toast('Markiert, jetzt kopiere'); });
      if (!navigator.clipboard) { ta.focus(); ta.select(); }
      break;
    }
    case 'doimport': restoreFrom(val('x-json')); break;
    case 'savefile': saveBackupFile(); break;
    case 'review': UI.sheet = { type: 'simple', kind: 'review', off: 0 }; renderSheet(); break;
    case 'revweek': UI.sheet.off = Math.max(0, (UI.sheet.off || 0) + Number(el.dataset.d)); renderSheet(); break;
    case 'reviewdone': S.reviews = [...(S.reviews || []), el.dataset.w]; commit('+20 XP. Bis nächsti Wuche!'); break;
    case 'chals': UI.sheet = { type: 'simple', kind: 'chals' }; renderSheet(); break;
    case 'chalstart': chals().push({ id: uid(), type: el.dataset.k, cat: el.dataset.cat, start: ymd(today()) }); commit('Challenge gstartet. Du schaffsch das!'); break;
    case 'chaldone': { const c = chals().find(x => x.id === el.dataset.id); if (c) { c.closed = true; c.won = true; save(); render(); toast('+100 XP. Mega!'); } break; }
    case 'chaldrop': { const c = chals().find(x => x.id === el.dataset.id); if (c) { c.closed = true; save(); render(); } break; }
    case 'chalretry': { const c = chals().find(x => x.id === el.dataset.id); if (c) { c.closed = true; chals().push({ id: uid(), type: c.type, cat: c.cat, start: ymd(today()) }); save(); render(); toast('Nöii Rundi, nöis Glück'); } break; }
    case 'chal52': {
      let sc = S.cats.find(c => c.kind === 'spar');
      if (!sc) { sc = { id: uid(), name: 'Spare', icon: 'piggy', color: '#33B872', kind: 'spar', period: 'month', limit: 0 }; S.cats.push(sc); }
      const n = Number(el.dataset.n);
      S.entries.push({ id: uid(), amount: n, cat: sc.id, note: `52-Wuche-Challenge · Wuche ${n}`, date: ymd(today()), ts: Date.now(), chal: el.dataset.id, to: 'auto', split: splitFor(n) });
      save(); render(); toast(`Wuche ${n} gspart!`); break;
    }
    case 'backuplater': S.backupSnooze = ymd(today()); save(); render(); break;
    case 'wipe-confirm': break;
    case 'dowipe': try { localStorage.removeItem(KEY); } catch {} S = blankState({}); UI.tab = 'home'; commit('Alles glöscht'); UI.sheet = { type: 'setup', draft: { name: '', income: '', startDay: 1, goal: '', target: '', base: '' } }; renderSheet(); break;
    case 'setup': UI.sheet = { type: 'setup', draft: { name: S.demo ? '' : S.name, income: S.demo ? '' : S.income, startDay: S.startDay || 1, goal: S.demo ? '' : S.goal?.name || '', target: S.demo ? '' : S.goal?.target || '', base: S.demo ? '' : S.goal?.base || '' } }; renderSheet(); break;
    case 'dosetup': {
      const income = num('u-income');
      if (!(income > 0)) { toast('Bitte dis Iikomme iigä'); break; }
      S = blankState({ name: val('u-name'), income, startDay: Number(val('u-start')) || 1, goal: { name: val('u-goal') || 'Sparziel', target: num('u-target') || 1000, base: num('u-base') || 0 } });
      UI.tab = 'home'; commit('Willkomme bi Batzli!'); break;
    }
  }
});
function blankState(o) {
  return { v: 1, demo: false, name: o.name || '', income: o.income || 0, startDay: o.startDay || 1, created: ymd(today()), goal: o.goal || { name: 'Sparziel', target: 1000, base: 0 }, cats: PRESETS.map(p => ({ id: uid(), ...p })), entries: [], checkins: [] };
}
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && UI.sheet) { UI.sheet = null; renderSheet(); }
  if (ev.key === 'Enter' && UI.sheet && ev.target.matches('input')) {
    const primary = layer.querySelector('.btn:not(.danger):not(.ghost)');
    if (primary) { ev.preventDefault(); primary.click(); }
  }
});
// a new day starts while the app stays open
document.addEventListener('visibilitychange', () => { if (!document.hidden && !UI.sheet) render(); });

render();
try { if ('serviceWorker' in navigator && /^https:$/.test(location.protocol) && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js'); } catch {}
})();
</script>
</body></html>
